name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goarch: amd64
            suffix: linux-amd64
          - goarch: arm64
            suffix: linux-arm64
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27.x'
          cache: true
      - name: Build release binaries
        env:
          GOOS: linux
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: |
          mkdir -p dist
          go build -trimpath -ldflags='-s -w' -o dist/polaris-${{ matrix.suffix }} ./cmd/polaris
          go build -trimpath -ldflags='-s -w' -o dist/polaris-agent-${{ matrix.suffix }} ./cmd/polaris-agent
          tar -czf dist/polaris-${{ matrix.suffix }}.tar.gz -C dist polaris-${{ matrix.suffix }} polaris-agent-${{ matrix.suffix }}
      - name: Upload release artifacts
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.tar.gz
